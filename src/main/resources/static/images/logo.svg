<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%" aria-label="Blood Buddy Droplet Logo">
  <defs>
    <!-- Rich Ruby-Red Material Gradient -->
    <radialGradient id="rubyDropGrad" cx="36%" cy="36%" r="64%">
      <stop offset="0%" stop-color="#FF6B81" />
      <stop offset="25%" stop-color="#E53935" />
      <stop offset="60%" stop-color="#B71C1C" />
      <stop offset="90%" stop-color="#7F0000" />
      <stop offset="100%" stop-color="#4A0008" />
    </radialGradient>

    <!-- Restrained Top Specular Highlight -->
    <linearGradient id="rubySpecGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Base Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
    </filter>
  </defs>

  <!-- Base Soft Shadow -->
  <ellipse cx="50" cy="112" rx="26" ry="5" fill="#000000" opacity="0.35" filter="url(#softShadow)" />

  <!-- Genuine Droplet Silhouette: Pointed apex at top, rounded bottom body -->
  <path d="M 50 10 C 50 10, 18 48, 18 72 A 32 32 0 0 0 82 72 C 82 48, 50 10, 50 10 Z"
        fill="url(#rubyDropGrad)" />

  <!-- Subtle Inner Depth Rim -->
  <path d="M 50 14 C 50 14, 22 50, 22 72 A 28 28 0 0 0 78 72 C 78 50, 50 14, 50 14 Z"
        fill="none" stroke="#FF758F" stroke-width="1.2" opacity="0.35" />

  <!-- Restrained Specular Reflection (Top-Left Curvature) -->
  <ellipse cx="37" cy="48" rx="6" ry="16"
           transform="rotate(-26 37 48)"
           fill="url(#rubySpecGrad)" />
  <circle cx="33" cy="36" r="2.5" fill="#FFFFFF" opacity="0.85" />

  <!-- Clean, Readable Heart Motif (Subtle and Legible) -->
  <path d="M 50 63 C 47.5 58.5, 41 58.5, 41 64 C 41 69.5, 50 77, 50 77 C 50 77, 59 69.5, 59 64 C 59 58.5, 52.5 58.5, 50 63 Z"
        fill="#FFFFFF" opacity="0.28" />
</svg>
